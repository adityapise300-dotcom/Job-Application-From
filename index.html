<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <section class="top_section">
            <h1>
                Job Application (Web)
            </h1>
        </section>
        <section class="first_line">
            <div>
            <h4>First Name</h4>
            <input type="text">
            </div>
            <div>
            <h4>Last Name</h4>
            <input type="text">
            </div>
        </section>
        <section class="second_line">
            <div>
            <h4>Email</h4>
            <input type="text">
            </div>
            <div>
            <h4>Job Role</h4>
            <select name="Select Job Role" id="role">
                <option value="Select Job Role">Select Job Role</option>
                <option value="Hr team">Hr Team</option>
                <option value="Management team">Management Team</option>
                <option value="Technical team">Technical Team</option>
                <option value="Helping staff">Helping Staff</option>
            </select>
            </div>
        </section>
        <section class="third_line">
            <h4>Address</h4>
            <input type="text" class="Address">
        </section>
        <section class="fourth_line">
            <div>
            <h4>City</h4>
            <input type="text">
            </div>
            <div>
            <h4>Pincode</h4>
            <input type="number">
            </div>
        </section>
        <section class="fifth_line">
            <div>
            <h4>Start Date</h4>
            <input type="date">
            </div>
            <div>
            <h4>Upload your CV</h4>
            <input type="file" class="file">
            </div>
        </section>
    </div>
    
</body>
</html>
